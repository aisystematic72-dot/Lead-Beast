{% extends "base.html" %}{% block title %}Log in · LeadBeast{% endblock %}
{% block bare %}
<div class="login-wrap">
  <div class="card login">
    <div class="brand" style="padding:0">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 L9 7 L13 13 L16 9 L20 18"></path></svg></span>
      <span class="name">LeadBeast</span>
    </div>
    <div><h1 style="font-size:24px">Log in</h1>
      <div class="prose" style="margin-top:4px">Find who should buy, prove why, and approve before anything is sent.</div></div>
    {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="field"><label for="u">Username</label>
        <input id="u" name="username" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required></div>
      <button class="primary btn-lg" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}

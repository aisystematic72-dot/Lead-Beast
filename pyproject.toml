[project]
name = "leadbeast"
version = "1.0.0"
description = "Personal, self-hosted lead finder: cited evidence, explainable scores, human-approved outreach."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "procrastinate>=2.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "selectolax>=0.3.21",
  "rapidfuzz>=3.9",
  "phonenumbers>=8.13",
  "tldextract>=5.1",
  "usaddress>=0.5.10",
  "dnspython>=2.6",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "typer>=0.12",
  "structlog>=24.2",
  "uuid-utils>=0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.44"]
pdf = ["weasyprint>=62"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.103",
  "ruff>=0.5",
  "mypy>=1.10",
  "respx>=0.21",
  "import-linter>=2.0",
]

[project.scripts]
leadbeast = "leadbeast.cli:app"
lb = "leadbeast.cli:app"

[project.entry-points."leadbeast.detectors"]
website_presence = "leadbeast.detectors.website_presence:WebsitePresence"
website_quality = "leadbeast.detectors.website_quality:WebsiteQuality"
marketing_stack = "leadbeast.detectors.marketing_stack:MarketingStack"
marketing_activity = "leadbeast.detectors.marketing_activity:MarketingActivity"
listing_claimed = "leadbeast.detectors.listing_claimed:ListingClaimed"
vitality = "leadbeast.detectors.vitality:Vitality"
operating_style = "leadbeast.detectors.operating_style:OperatingStyle"
site_health = "leadbeast.detectors.site_health:SiteHealth"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadbeast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: needs a running PostgreSQL (LB_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP047"]  # FastAPI Depends() defaults; TypeVar style

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "E501"]
# long regex patterns read better unwrapped
"src/leadbeast/detectors/*.py" = ["E501"]
"src/leadbeast/contacts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "leadbeast.domain.*", "leadbeast.evidence.fold", "leadbeast.evidence.facts",
  "leadbeast.evidence.freshness", "leadbeast.scoring.engine", "leadbeast.scoring.parts",
  "leadbeast.scoring.gates", "leadbeast.scoring.gaps", "leadbeast.scoring.problems",
  "leadbeast.policy.engine", "leadbeast.cost.budget",
]
strict = true

[tool.importlinter]
root_package = "leadbeast"

[[tool.importlinter.contracts]]
name = "Core layers do not depend on delivery layers"
type = "forbidden"
source_modules = ["leadbeast.domain", "leadbeast.evidence", "leadbeast.scoring", "leadbeast.policy"]
forbidden_modules = ["leadbeast.jobs", "leadbeast.api", "leadbeast.web", "leadbeast.cli"]

[[tool.importlinter.contracts]]
name = "Domain and the pure evidence fold depend on nothing else"
type = "forbidden"
source_modules = ["leadbeast.domain", "leadbeast.evidence.fold", "leadbeast.evidence.facts"]
forbidden_modules = ["leadbeast.scoring", "leadbeast.detectors", "leadbeast.identity", "leadbeast.db"]

[[tool.importlinter.contracts]]
name = "Alerts never send to a business"
type = "forbidden"
source_modules = ["leadbeast.alerts"]
forbidden_modules = ["leadbeast.outreach"]
